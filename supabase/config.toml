project_id = "vlgiclyuxaleyusalexo"

[functions.push-mission-assignment]
# Authenticated via the x-push-secret header instead — this is an internal
# server-to-server call from a Postgres trigger, not a client request, so no
# Supabase JWT/apikey is available or needed.
verify_jwt = false

[functions.notify-access-request]
# Authenticated via x-access-secret — same reasoning as push-mission-assignment.
verify_jwt = false

[functions.notify-access-decision]
verify_jwt = false

[functions.send-form-email]
# Called directly by the Flutter app, not by a Postgres trigger -- deliberately
# left at the default verify_jwt = true. The Supabase client auto-attaches the
# anon key (a valid JWT) on functions.invoke(), so this still blocks arbitrary
# internet requests without needing a separate shared secret.
