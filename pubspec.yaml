name: resqruck
description: ResQruck - Field Medical Protocols
publish_to: 'none'
version: 1.0.1+105

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^2.4.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  file_picker: ^8.0.0
  share_plus: ^12.0.2
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  http: ^1.2.0
  image_picker: ^1.1.0
  speech_to_text: ^7.0.0
  encrypt: ^5.0.1
  crypto: ^3.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  google_mlkit_text_recognition: ^0.13.0
  supabase_flutter: ^2.5.0
  archive: ^4.0.9
  image: ^4.5.0
  battery_plus: ^6.0.1
  cached_network_image: ^3.3.1
  in_app_update: ^4.2.1
  in_app_purchase: ^3.2.0
  window_manager: ^0.5.2
  desktop_drop: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.18.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "ResQruckIcon (2).jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "ResQruckIcon (2).jpg"
    icon_size: 256
  macos:
    generate: true
    image_path: "ResQruckIcon (2).jpg"

# Command Console (lib/main_admin.dart) Microsoft Store packaging.
# build_windows is false because `flutter build windows` needs -t
# lib/main_admin.dart to build the console rather than the field app —
# msix would otherwise rebuild the wrong entry point itself. Build the
# console first (see scripts/build_windows_both.ps1), then run
# `dart run msix:create` to wrap that existing output.
msix_config:
  store: true
  display_name: Res-Q-Ruck Command Console
  publisher_display_name: allamericanconsulting
  identity_name: allamericanconsulting.Res-Q-RuckCommandConsole
  publisher: CN=E427069E-AABA-41B5-88C2-BB1C9C371A8F
  msix_version: 1.0.3.0
  logo_path: "ResQruckIcon (2).jpg"
  capabilities: internetClient
  build_windows: false
  output_path: dist/msix
  output_name: ResQruckCommandConsole

flutter:
  uses-material-design: true
  assets:
    - assets/protocols/
