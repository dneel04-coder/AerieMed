name: resqruck
description: ResQruck - Field Medical Protocols
publish_to: 'none'
version: 1.0.0+58

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^2.4.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  file_picker: ^8.0.0
  share_plus: ^12.0.2
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  http: ^1.2.0
  image_picker: ^1.1.0
  speech_to_text: ^7.0.0
  encrypt: ^5.0.1
  crypto: ^3.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  google_mlkit_text_recognition: ^0.13.0
  supabase_flutter: ^2.5.0
  archive: ^4.0.9
  battery_plus: ^6.0.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "ResQruckIcon (2).jpg"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/protocols/
