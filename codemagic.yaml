workflows:

  # ── Signed IPA → TestFlight ──────────────────────────────────────────────────
  ios-signed:
    name: iOS — Signed (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aerie.aerimed1

    scripts:
      - name: Flutter packages
        script: flutter pub get

      - name: CocoaPods install
        script: cd ios && pod install

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files \
            com.aerie.aerimed1 \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Archive app
        script: |
          set -e
          cd ios && xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/Runner.xcarchive \
            PODS_PODFILE_DIR_PATH="$PWD" \
            PODS_ROOT="$PWD/Pods" \
            OTHER_CODE_SIGN_FLAGS="--keychain /Users/builder/Library/Keychains/ios-build.keychain-db" \
            archive

      - name: Export IPA
        script: |
          set -e
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/Runner.xcarchive \
            -exportPath $CM_BUILD_DIR/ios/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - $CM_BUILD_DIR/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true

  # ── Unsigned IPA (no Apple Developer account required) ──────────────────────
  # Produces an IPA you can install via Sideloadly or AltStore.
  # Re-sign required every 7 days with a free Apple ID.
  ios-unsigned:
    name: iOS — Unsigned (Sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter packages
        script: flutter pub get

      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -r AerieMed-unsigned.ipa Payload/

    artifacts:
      - build/ios/unsigned/AerieMed-unsigned.ipa

    publishing:
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true
